<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ofuje CBT | Professional Examination Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --primary: #4f46e5;
        --primary-dark: #4338ca;
        --secondary: #64748b;
        --bg: #f8fafc;
        --white: #ffffff;
        --text-dark: #1e293b;
        --error: #ef4444;
        --success: #22c55e;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    body.dark-mode {
        --bg: #1f2937;
        --white: #374151;
        --text-dark: #f3f4f6;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text-dark); line-height: 1.6; transition: background 0.3s, color 0.3s; }
    .hidden { display: none !important; }

    /* Fade Animations */
    .fade-enter { opacity: 0; transform: scale(0.95); transition: 0.3s ease; }
    .fade-enter-active { opacity: 1; transform: scale(1); transition: 0.3s ease; }
    .fade-exit { opacity: 1; transform: scale(1); transition: 0.2s ease; }
    .fade-exit-active { opacity: 0; transform: scale(0.95); transition: 0.2s ease; }

    .container { max-width: 900px; margin: 2rem auto; padding: 1.5rem; transition: background 0.3s; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { color: var(--primary); font-size: 2.5rem; }
    .card { background: var(--white); padding: 2rem; border-radius: 12px; box-shadow: var(--shadow); transition: background 0.3s, color 0.3s, transform 0.2s; }
    .card:hover { transform: scale(1.02); }

    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    input[type="text"], input[type="number"], select {
        width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; transition: border 0.2s;
    }
    input[type="text"]:focus, select:focus { border-color: var(--primary); }

    .btn {
        background: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem;
        border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.3s, transform 0.15s;
    }
    .btn:hover { background: var(--primary-dark); transform: scale(1.03); }
    .btn:active { transform: scale(0.97); }

    .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); margin-top: 1rem; }

    /* Dark Mode Toggle */
    .dark-toggle {
        position: fixed; top: 1rem; right: 1rem;
        background: var(--primary); color: #fff; border: none;
        padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-weight: bold; z-index: 999;
        transition: 0.3s, transform 0.15s;
    }
    .dark-toggle:hover { transform: scale(1.1); }

    .search-box { position: relative; margin-bottom: 1.5rem; }
    .search-box i { position: absolute; left: 1rem; top: 1rem; color: var(--secondary); }
    .search-box input { padding-left: 2.5rem; }

    .grid-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .item-card { 
        background: var(--white); border: 1px solid #e2e8f0; padding: 1.5rem; 
        border-radius: 8px; text-align: center; cursor: pointer; transition: 0.3s, transform 0.2s;
    }
    .item-card:hover { border-color: var(--primary); transform: translateY(-5px) scale(1.03); }
    .item-card i { font-size: 2rem; color: var(--primary); margin-bottom: 1rem; }

    .quiz-header { display: flex; justify-content: space-between; margin-bottom: 2rem; background: #eef2ff; padding: 1rem; border-radius: 8px; transition: background 0.3s; }
    body.dark-mode .quiz-header { background: #374151; }

    .options-list { list-style: none; }
    .option { 
        background: #f1f5f9; padding: 1rem; margin-bottom: 0.5rem; 
        border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.3s, transform 0.15s, background 0.3s;
    }
    .option:hover { transform: scale(1.02); }
    .option.selected { border-color: var(--primary); background: #e0e7ff; animation: popFade 0.25s; }
    body.dark-mode .option { background: #4b5563; color: #f3f4f6; }
    body.dark-mode .option.selected { background: #6366f1; }

    @keyframes popFade {
        0% { transform: scale(0.95); opacity: 0.6; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }

    .nav-btns { display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }

    .result-score { font-size: 3rem; font-weight: bold; color: var(--primary); text-align: center; }
    .correction-item { margin-top: 1rem; padding: 1rem; border-left: 4px solid var(--primary); background: var(--bg); transition: 0.3s; }

    .question-nav { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; justify-content: center; }
    .question-nav button {
        padding: 0.5rem 0.75rem; border-radius: 6px; border: 1px solid var(--primary); background: var(--white);
        cursor: pointer; font-weight: bold; transition: 0.2s, transform 0.15s;
    }
    .question-nav button:hover { transform: scale(1.1); }
    .question-nav button.answered { background: var(--success); color: #fff; }
    .question-nav button.unanswered { background: black; color: #fff; }
    body.dark-mode .question-nav button { background: #374151; color: #f3f4f6; border: 1px solid var(--primary); }
    body.dark-mode .question-nav button.answered { background: #22c55e; color: #fff; }
    body.dark-mode .question-nav button.unanswered { background: black; color: #fff; }
</style>
</head>

<button class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark Mode</button>

<div class="container">
    <header>
        <h1><i class="fas fa-graduation-cap"></i> Ofuje CBT</h1>
        <p>Professional Excellence in Assessment</p>
    </header>

    <div id="view-login" class="card">

        <div class="form-group">
            <input type="text" id="access-code" placeholder="Enter alphanumeric code (e.g. OFUJE-001)">
            <p id="login-error" style="color: var(--error); margin-top: 0.5rem;" class="hidden"></p>
        </div>

        <p style="margin-top: 1rem; font-size: 0.8rem; color: var(--secondary);">Message 08107528980 on WhatsApp to get your access code</p>
    </div>

    <div id="view-courses" class="hidden">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="courseSearch" placeholder="Search courses..." onkeyup="filterItems('courseSearch', 'course-grid')">
        </div>
        <h3>Select a Course</h3>
        <div class="grid-list" id="course-grid"></div>
    </div>

    <div id="view-topics" class="hidden">
        <button class="btn-outline" onclick="showView('view-courses')"><i class="fas fa-arrow-left"></i> Back</button>
        <div class="search-box" style="margin-top: 1rem;">
            <i class="fas fa-search"></i>
            <input type="text" id="topicSearch" placeholder="Search topics..." onkeyup="filterItems('topicSearch', 'topic-grid')">
        </div>
        <h3 id="selected-course-title">Topics</h3>
        <div class="grid-list" id="topic-grid" style="margin-top: 1rem;"></div>
    </div>

    <div id="view-settings" class="hidden card">
        <h3>Exam Configuration</h3>
        <div class="form-group">
            <label>Number of Questions</label>
            <select id="set-questions">
                              <option value="10">10 Questions</option>
                <option value="20">20 Questions</option>
                <option value="30">30 Questions</option>
                <option value="40">40 Questions</option>
                                <option value="45">45 Questions</option>
            </select>
        </div>
        <div class="form-group">
            <label>Timer</label>
            <select id="set-timer">
                <option value="0">No Timer</option>
                <option value="20">20 Minutes</option>
                <option value="60">60 Minutes</option>
            </select>
        </div>
        <button class="btn" onclick="startQuiz()">Start Examination</button>
    </div>

    <div id="view-quiz" class="hidden card">
        <div class="quiz-header">
            <span><i class="fas fa-clock"></i> <span id="timer-display">Untimed</span></span>
            <span>Q: <span id="q-count">0/0</span></span>
        </div>
        <div id="question-container"></div>
        <div class="question-nav" id="question-nav"></div>
        <div class="nav-btns">
            <button class="btn btn-outline" id="prevBtn" onclick="changeQuestion(-1)">Previous</button>
            <button class="btn" id="nextBtn" onclick="changeQuestion(1)">Next</button>
            <button class="btn" id="submitBtn" onclick="calculateResults()" style="background: var(--success);">Submit</button>
        </div>
    </div>

    <div id="view-results" class="hidden card">
        <h2 style="text-align: center;">Assessment Summary</h2>
        <div class="result-score" id="res-score">0%</div>
        <div id="res-details" style="text-align: center; margin-bottom: 2rem;"></div>
        <h3>Corrections</h3>
        <div id="corrections-list"></div>
        <button class="btn" style="margin-top: 2rem;" onclick="location.reload()">Return to Home</button>
    </div>
</div>

/* ===== VIEW CONTROL ===== */
function showView(id){
document.querySelectorAll('.container>div').forEach(v=>v.classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
currentView=id;
}

/* ===== CONFIRM BACK ===== */
function confirmBack(target){
if(quizStarted || currentView!=="view-courses"){
if(!confirm("Are you sure you want to go back? Progress may be lost."))return;
}
quizStarted=false;
showView(target);
}


// Fade Functions
function fadeIn(element){element.classList.remove('hidden');element.classList.add('fade-enter');requestAnimationFrame(()=>{element.classList.add('fade-enter-active');element.classList.remove('fade-enter');});setTimeout(()=>element.classList.remove('fade-enter-active'),350);}
function fadeOut(element,callback){element.classList.add('fade-exit');requestAnimationFrame(()=>{element.classList.add('fade-exit-active');element.classList.remove('fade-exit');});setTimeout(()=>{element.classList.remove('fade-exit-active');element.classList.add('hidden');if(callback)callback();},250);}

// Show View with Fade
function showView(viewId){
    document.querySelectorAll('.container > div').forEach(div=>{if(!div.classList.contains('hidden'))fadeOut(div);});
    setTimeout(()=>fadeIn(document.getElementById(viewId)),260);
}

// Login
function handleLogin(){
    const code=document.getElementById('access-code').value.toUpperCase();
    const errorEl=document.getElementById('login-error');
    if(!accessCodes.includes(code)){errorEl.innerText="Invalid Access Code";errorEl.classList.remove('hidden');return;}
    let usage=JSON.parse(localStorage.getItem('ofuje_usage')||'{}');
    let count=usage[code]||0;
    if(count>=2){errorEl.innerText="Code usage limit reached (Max 2).";errorEl.classList.remove('hidden');return;}
    usage[code]=count+1;
    localStorage.setItem('ofuje_usage',JSON.stringify(usage));
    initCourses(); showView('view-courses');
}

function initCourses(){const grid=document.getElementById('course-grid');grid.innerHTML='';Object.keys(database).forEach(course=>{const div=document.createElement('div');div.className='item-card';div.innerHTML=`<i class="fas fa-book"></i><h4>${course}</h4>`;div.onclick=()=>selectCourse(course);grid.appendChild(div);});}
function selectCourse(course){currentUserData.course=course;document.getElementById('selected-course-title').innerText=course+" Topics";const grid=document.getElementById('topic-grid');grid.innerHTML='';database[course].forEach(topic=>{const div=document.createElement('div');div.className='item-card';div.innerHTML=`<i class="fas fa-layer-group"></i><h4>${topic}</h4>`;div.onclick=()=>selectTopic(topic);grid.appendChild(div);});showView('view-topics');}
function selectTopic(topic){currentUserData.topic=topic;showView('view-settings');}
function filterItems(inputId,gridId){let input=document.getElementById(inputId).value.toLowerCase();let cards=document.getElementById(gridId).getElementsByClassName('item-card');for(let card of cards)card.style.display=card.innerText.toLowerCase().includes(input)?"":"none";}


/* ===== UTILS ===== */
function shuffleArray(arr){
for(let i=arr.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
}

/* ===== OPTION SHUFFLE (LOCK AFTER SELECT) ===== */
function shuffleOptions(q,i){
if(!q._shuffled){
const opts=q.a.map((t,idx)=>({t,idx}));
shuffleArray(opts);
q.a=opts.map(o=>o.t);
q.correct=opts.findIndex(o=>o.idx===q.correct);
q._shuffled=true;
}
}

// Quiz
function startQuiz() {
    const qCount = parseInt(document.getElementById('set-questions').value);
    const tLimit = parseInt(document.getElementById('set-timer').value);
    currentUserData.numQuestions = qCount;
    currentUserData.timeLimit = tLimit;

    // Get questions for the selected topic
    const topicQuestions = [...(questionsDB[currentUserData.topic] || [])];
    if(topicQuestions.length === 0){
        alert("No questions available for this topic yet!");
        return;
    }

    shuffleArray(topicQuestions);
    quizData = topicQuestions.slice(0, qCount); // Limit to user pick

    currentQIndex = 0;
    userAnswers = {};

    showView('view-quiz');
    renderQuestion();
    startTimer(currentUserData.timeLimit);
    initQuestionNav();
}

function shuffleArray(array){for(let i=array.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];}}

function renderQuestion(){const q=quizData[currentQIndex]; const container=document.getElementById('question-container');document.getElementById('q-count').innerText=`${currentQIndex+1}/${quizData.length}`;
container.innerHTML=`<h3>${q.q}</h3><div class="options-list">${q.a.map((opt,i)=>`<div class="option ${userAnswers[currentQIndex]===i?'selected':''}" onclick="selectOption(${i})">${opt}</div>`).join('')}</div>`;
document.getElementById('prevBtn').disabled=currentQIndex===0;
document.getElementById('nextBtn').classList.toggle('hidden',currentQIndex===quizData.length-1);
document.getElementById('submitBtn').classList.toggle('hidden',currentQIndex!==quizData.length-1);
updateQuestionNav();}

function selectOption(index){userAnswers[currentQIndex]=index; renderQuestion();}
function changeQuestion(step){currentQIndex+=step; renderQuestion();}
function startTimer(mins){if(mins===0){document.getElementById('timer-display').innerText='Untimed';return;}let seconds=mins*60;timerInterval=setInterval(()=>{let m=Math.floor(seconds/60),s=seconds%60;document.getElementById('timer-display').innerText=`${m}:${s<10?'0'+s:s}`;if(seconds<=0){clearInterval(timerInterval);calculateResults();}seconds--;},1000);}
function calculateResults(){clearInterval(timerInterval);let score=0,listHTML='';quizData.forEach((q,i)=>{const isCorrect=userAnswers[i]===q.correct;if(isCorrect)score++;listHTML+=`<div class="correction-item"><p><strong>Q${i+1}: ${q.q}</strong></p><p style="color:${isCorrect?'var(--success)':'var(--error)'}">Your Answer: ${userAnswers[i]!==undefined?q.a[userAnswers[i]]:'No Answer'}</p>${!isCorrect?`<p style="color: var(--success)">Correct Answer: ${q.a[q.correct]}</p>`:''}</div>`;});const percent=Math.round((score/quizData.length)*100);let remark=percent>=50?"Congratulations! Professional Pass.":"Need Improvement. Try Again.";document.getElementById('res-score').innerText=percent+"%";document.getElementById('res-details').innerHTML=`<p>Score: ${score} / ${quizData.length}</p><p><strong>${remark}</strong></p>`;document.getElementById('corrections-list').innerHTML=listHTML;showView('view-results');}

// Question Nav Panel
function initQuestionNav(){const nav=document.getElementById('question-nav');nav.innerHTML='';quizData.forEach((_,i)=>{const btn=document.createElement('button');btn.innerText=i+1;btn.onclick=()=>{currentQIndex=i; renderQuestion();};nav.appendChild(btn);});}
function updateQuestionNav(){const buttons=document.getElementById('question-nav').children;for(let i=0;i<buttons.length;i++){buttons[i].classList.remove('answered','unanswered');if(userAnswers[i]!==undefined)buttons[i].classList.add('answered');else buttons[i].classList.add('unanswered');}}

/* ===== BLOCK BROWSER BACK DURING QUIZ ===== */
history.pushState(null,null,location.href);
window.onpopstate=()=>{if(quizStarted){history.pushState(null,null,location.href);alert("Submit exam before leaving.");}};
</script>
